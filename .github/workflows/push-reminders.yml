name: Push reminders

on:
  schedule:
    # Her 30 dakikada bir (UTC). Ücretsiz limit: ayda ~1440 dk.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y && npm install firebase-admin@12
        working-directory: tools/push
      - run: node send.js
        working-directory: tools/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
