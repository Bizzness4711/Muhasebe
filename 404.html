<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f5fb">
  <title>Sayfa Bulunamadı | Parnex</title>
  <link rel="icon" href="/Muhasebe/icons/logo.svg">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171827;background:#f4f5fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(680px,100%);padding:48px 32px;text-align:center;background:#fff;border:1px solid #e6e7f0;border-radius:24px;box-shadow:0 18px 60px rgba(23,24,39,.08)}
    .logo{width:64px;height:64px;margin:0 auto 20px}
    .code{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:#6256d9}
    h1{margin:10px 0 12px;font-size:clamp(2rem,6vw,3.4rem)}
    p{margin:0 auto 28px;max-width:520px;color:#66697a;line-height:1.7}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700}
    .primary{background:#6256d9;color:#fff}
    .secondary{background:#eef0f8;color:#292b3a}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/Muhasebe/icons/logo-192.png" alt="Parnex logosu">
    <div class="code">404 · SAYFA BULUNAMADI</div>
    <h1>Aradığınız sayfayı bulamadık.</h1>
    <p>Adres değişmiş, kaldırılmış veya yanlış yazılmış olabilir. Parnex'in ana sayfasına dönebilir ya da bütçe ve kişisel finans araçlarından birini açabilirsiniz.</p>
    <div class="actions">
      <a class="primary" href="/Muhasebe/">Ana Sayfaya Dön</a>
      <a class="secondary" href="/Muhasebe/butce/">Bütçe Takibi</a>
    </div>
  </main>
</body>
</html>
